[pytest]
# Discover tests in both the main service's tests/ folder and (optionally)
# the aiops-genai/ subtree when run from the repo root.
testpaths = tests
# Add the repo root to sys.path so that `import db`, `import services`, etc.
# resolve correctly without package installation.
pythonpath = .
# Show short tracebacks and 10 slowest tests
addopts = --tb=short -q
