[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
# testpaths tells pytest WHERE to look for test files.
# pythonpath adds the repo root to sys.path so `import db`, `import services`
# etc. resolve without needing to install the package.
testpaths = tests
pythonpath = .

# ── Output ────────────────────────────────────────────────────────────────────
# --tb=short   → print condensed tracebacks (easier to read than full default)
# -q           → quiet mode (less noise, still shows PASSED/FAILED counts)
# --cov        → measure which lines of our source code tests actually hit
# --cov-report → print a table in the terminal AND write an XML file (for CI)
#                term-missing shows which exact line numbers were NOT covered
addopts =
    --tb=short
    -q
    --cov=.
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

# ── Coverage ──────────────────────────────────────────────────────────────────
# Exclude files/directories that don't need coverage tracking:
[coverage:run]
omit =
    venv/*
    */tests/*
    conftest.py
    */migrations/*

[coverage:report]
# Show files only if their coverage is below 100%
skip_covered = false
show_missing = true
